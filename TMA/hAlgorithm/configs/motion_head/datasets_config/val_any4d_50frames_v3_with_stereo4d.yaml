# Any4D-aligned evaluation config (v3) + Stereo4D
#
# Standardized evaluation:
# - PointOdyssey: 10 scenes × 50 frames = 500 frames total
# - Kubric4D: 10 scenes × 50 frames = 500 frames total
# - Stereo4D: 10 scenes × 30 frames = 300 frames total
# - Total: 30 scenes, 1300 frames
#
# Sampling method:
#   - mf_scene_sampling_strategy: end:10 → select last 10 scenes
#   - SequentialClipSampler(view_num=N) → N consecutive frames per scene
#   - sampling_strategy: [0] → take the single clip from each scene

datasets:
  # PointOdyssey - 10 scenes × 50 frames
  - data_path: /mnt/netdata/Team/AI/datasets/TMD/PointOdyssey/test_mf_with_tracking.json
    only_pointmap: true
    with_pointmap: true
    min_depth: 0.001
    max_depth: 100.0
    point_normalize_mode: "distance"
    data_root: /mnt/netdata/Team/AI/datasets/TMD/
    pipeline: hAlgorithm/configs/dataset/pipeline_14x/base4d.py
    name: pointodyssey
    sampling_strategy: [0]
    mf_scene_sampling_strategy: end:10  # Select 10 scenes
    prob: 1.0

    type: hAlgorithm.datasets_mv_4d.pointodyssey_track_dataset.PointOdysseyTrackDataset
    mf_to_mv: true
    clip_maxlen: null
    clip_step: null
    clip_sampler:
      type: hAlgorithm.datasets_mv.clip_sampler.sequential_sampler.SequentialClipSampler
      view_num: 50  # 50 consecutive frames per scene
      start_idx: 0
  
  # Kubric-4D - 10 scenes × 50 frames
  - data_path: /mnt/netdata/Team/AI/datasets/TMD/Kubric-4D/test_mf_with_tracking_2048.json
    only_pointmap: true
    with_pointmap: true
    min_depth: 0.001
    max_depth: 100.0
    point_normalize_mode: "distance"
    data_root: /mnt/netdata/Team/AI/datasets/TMD/
    pipeline: hAlgorithm/configs/dataset/pipeline_14x/base4d.py
    name: kubric4d
    sampling_strategy: [0]
    mf_scene_sampling_strategy: end:10  # Select 10 scenes
    prob: 1.0

    type: hAlgorithm.datasets_mv_4d.kubric4d_track_dataset.Kubric4DTrackDataset
    mf_to_mv: true
    clip_maxlen: null
    clip_step: null
    clip_sampler:
      type: hAlgorithm.datasets_mv.clip_sampler.sequential_sampler.SequentialClipSampler
      view_num: 50  # 50 consecutive frames per scene
      start_idx: 0

  # Stereo4D - 10 scenes × 30 frames (min clip length is 32)
  - data_path: /mnt/nasTeam2/AI/datasets/TMD/Stereo4D/processed_data/stereo4d_test_mf_with_tracking.json
    only_pointmap: true
    with_pointmap: true
    min_depth: 0.001
    max_depth: 1000.0
    point_normalize_mode: "distance"
    data_root: /mnt/nasTeam2/AI/datasets/TMD/
    pipeline: hAlgorithm/configs/dataset/pipeline_14x/base4d.py
    name: stereo4d
    sampling_strategy: [0]
    mf_scene_sampling_strategy: all
    prob: 1.0

    type: hAlgorithm.datasets_mv_4d.stereo4d_track_dataset.Stereo4DTrackDataset
    mf_to_mv: true
    clip_maxlen: null
    clip_step: null
    clip_sampler:
      type: hAlgorithm.datasets_mv.clip_sampler.sequential_sampler.SequentialClipSampler
      view_num: 30
      start_idx: 0
