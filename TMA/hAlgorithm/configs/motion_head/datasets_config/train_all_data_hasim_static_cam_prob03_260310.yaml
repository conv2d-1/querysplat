# All opensource + HaSim static cam (prob=0.3)
# HaSim uses static camera dataset (Hasim_pinhole_4D_test)
datasets:
  - data_path: /mnt/netdata/Team/AI/datasets/TMD/PointOdyssey/train_mf_with_tracking.json
    only_pointmap: true
    with_pointmap: true
    min_depth: 0.001
    max_depth: 20.0
    point_normalize_mode: "distance"
    data_root: /mnt/netdata/Team/AI/datasets/TMD/
    pipeline: hAlgorithm/configs/dataset/pipeline_14x/base4d.py
    name: pointodyssey
    sampling_strategy: all
    mf_scene_sampling_strategy: all
    prob: 1.0

    type: hAlgorithm.datasets_4d.pointodyssey_track_dataset.PointOdysseyTrackDataset
    mf_to_mv: true
    clip_maxlen: 24
    clip_step: null
    clip_sampler:
      type: hAlgorithm.datasets_mv.clip_sampler.random_sampler.RandomClipSampler
      view_num: 4
      seed: null

  - data_path: /mnt/netdata/Team/AI/datasets/TMD/Kubric-4D/train_mf_with_tracking_2048.json
