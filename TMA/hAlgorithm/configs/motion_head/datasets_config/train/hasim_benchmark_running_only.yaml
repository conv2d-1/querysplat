# Training: HaSim-Benchmark Running ONLY (overfit experiment).
# clip_maxlen: null — no temporal clipping, so RandomClipSampler draws frames
# from the entire scene.  This maximises frame-to-frame temporal diversity.
# Time encoding denominator (max_frames) is the scene's total frame count,
# correctly provided by BaseTrackDataset.load_mf_files().

datasets:
  - data_path: /mnt/nasTeam2/AI/datasets/TMD/Hasim_benchmark/Running/mf_tracking.json
    only_pointmap: true
    with_pointmap: true
    min_depth: 0.001
    max_depth: 20.0
    point_normalize_mode: "distance"
    data_root: /mnt/nasTeam2/AI/datasets/TMD
    pipeline: hAlgorithm/configs/dataset/pipeline_14x/base4d.py
    name: hasim_benchmark_running
    sampling_strategy: all
    mf_scene_sampling_strategy: all
    prob: 1.0
    type: hAlgorithm.datasets_4d.hasim_track_dataset.HaSimTrackDataset
    skip_static_threshold: 0.02
    static_traj_ratio: 1.2
    mf_to_mv: true
    clip_maxlen: null
    clip_step: null
    clip_sampler:
      type: hAlgorithm.datasets_mv.clip_sampler.random_sampler.RandomClipSampler
      view_num: 4
      seed: null
