# Validation config: HaSim-Benchmark (Easy / Medium / Hard / Running)
# All scenes × 50 frames per level, sequential sampling.

datasets:
  # ── Easy: 10 scenes ─────────────────────────────────────────────────────────
  - data_path: /mnt/nasTeam2/AI/datasets/TMD/Hasim_benchmark/Easy/mf_tracking.json
    only_pointmap: true
    with_pointmap: true
    min_depth: 0.001
    max_depth: 20.0
    point_normalize_mode: "distance"
    data_root: /mnt/nasTeam2/AI/datasets/TMD
    pipeline: hAlgorithm/configs/dataset/pipeline_14x/base4d.py
    name: hasim_benchmark_easy
    sampling_strategy: [0]
    mf_scene_sampling_strategy: all
    prob: 1.0
    type: hAlgorithm.datasets_4d.hasim_track_dataset.HaSimTrackDataset
    skip_static_threshold: 0.02
    static_traj_ratio: 1.0
    mf_to_mv: true
    clip_maxlen: null
    clip_step: null
    clip_sampler:
      type: hAlgorithm.datasets_mv.clip_sampler.sequential_sampler.SequentialClipSampler
      view_num: 50
      start_idx: 0

  # ── Medium: 10 scenes (first 10 out of 15) ──────────────────────────────────
