# Validation config: Any4D + HaSim
# PointOdyssey + Kubric4D + HaSim (30 scenes, 1500 frames)

datasets:
  # PointOdyssey - 10 scenes × 50 frames
  - data_path: /mnt/netdata/Team/AI/datasets/TMD/PointOdyssey/test_mf_with_tracking.json
    only_pointmap: true
    with_pointmap: true
    min_depth: 0.001
    max_depth: 20.0
    point_normalize_mode: "distance"
    data_root: /mnt/netdata/Team/AI/datasets/TMD/
    pipeline: hAlgorithm/configs/dataset/pipeline_14x/base4d.py
    name: pointodyssey
    sampling_strategy: [0]
    mf_scene_sampling_strategy: end:10
    prob: 1.0
    type: hAlgorithm.datasets_4d.pointodyssey_track_dataset.PointOdysseyTrackDataset
    mf_to_mv: true
    clip_maxlen: null
    clip_step: null
    clip_sampler:
      type: hAlgorithm.datasets_mv.clip_sampler.sequential_sampler.SequentialClipSampler
      view_num: 50
      start_idx: 0

  # Kubric-4D - 10 scenes × 50 frames
  - data_path: /mnt/netdata/Team/AI/datasets/TMD/Kubric-4D/test_mf_with_tracking_2048.json
    only_pointmap: true
    with_pointmap: true
    min_depth: 0.001
    max_depth: 20.0
    point_normalize_mode: "distance"
    data_root: /mnt/netdata/Team/AI/datasets/TMD/
    pipeline: hAlgorithm/configs/dataset/pipeline_14x/base4d.py
    name: kubric4d
    sampling_strategy: [0]
    mf_scene_sampling_strategy: end:10
    prob: 1.0
    type: hAlgorithm.datasets_4d.kubric4d_track_dataset.Kubric4DTrackDataset
    mf_to_mv: true
    clip_maxlen: null
    clip_step: null
    clip_sampler:
      type: hAlgorithm.datasets_mv.clip_sampler.sequential_sampler.SequentialClipSampler
      view_num: 50
      start_idx: 0

  # HaSim - 10 val scenes × 50 frames
  # 物体
  - data_path: /mnt/nasTeam2/AI/datasets/TMD/Hasim_pinhole_4D/hasim_4d_mf_val_all_frames_with_tracking.json
    only_pointmap: true
    with_pointmap: true
    min_depth: 0.001
    max_depth: 20.0
    point_normalize_mode: "distance"
    data_root: /mnt/nasTeam2/AI/datasets/TMD
    pipeline: hAlgorithm/configs/dataset/pipeline_14x/base4d.py
    name: hasim
    sampling_strategy: [0]
    mf_scene_sampling_strategy: all
    prob: 1.0
    type: hAlgorithm.datasets_4d.hasim_track_dataset.HaSimTrackDataset
    mf_to_mv: true
    clip_maxlen: null
    clip_step: null
    clip_sampler:
      type: hAlgorithm.datasets_mv.clip_sampler.sequential_sampler.SequentialClipSampler
      view_num: 50
      start_idx: 0
  
  # 人物
  - data_path: /mnt/nasTeam2/AI/datasets/TMD/Hasim_benchmark/Running/mf_tracking.json
    only_pointmap: true
    with_pointmap: true
    min_depth: 0.001
    max_depth: 20.0
    point_normalize_mode: "distance"
    data_root: /mnt/nasTeam2/AI/datasets/TMD
    pipeline: hAlgorithm/configs/dataset/pipeline_14x/base4d.py
    name: hasim_benchmark_running
    sampling_strategy: [0]
    mf_scene_sampling_strategy: "first:5"
    prob: 1.0
    type: hAlgorithm.datasets_4d.hasim_track_dataset.HaSimTrackDataset
    skip_static_threshold: 0.02
    static_traj_ratio: 1.0
    mf_to_mv: true
    clip_maxlen: null
    clip_step: null
    clip_sampler:
      type: hAlgorithm.datasets_mv.clip_sampler.sequential_sampler.SequentialClipSampler
      view_num: 50
      start_idx: 0
