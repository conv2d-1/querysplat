datasets:
  # Stereo4D train split only
  - data_path: /mnt/nasTeam2/AI/datasets/TMD/Stereo4D/processed_data/stereo4d_train_mf_with_tracking.json
    only_pointmap: true
    with_pointmap: true
    min_depth: 0.001
    max_depth: 1000.0
    point_normalize_mode: "distance"
    data_root: /mnt/nasTeam2/AI/datasets/TMD/
    pipeline: hAlgorithm/configs/dataset/pipeline_14x/base4d.py
    name: stereo4d
    sampling_strategy: all
    mf_scene_sampling_strategy: all
    prob: 1.0

    type: hAlgorithm.datasets_mv_4d.stereo4d_track_dataset.Stereo4DTrackDataset
    mf_to_mv: true
    clip_maxlen: 20
    clip_step: null
    clip_sampler:
      type: hAlgorithm.datasets_mv.clip_sampler.random_sampler.RandomClipSampler
      view_num: 4
      seed: null
