datasets:
  - data_path: /mnt/netdata/Team/AI/datasets/TMD/Benchmark/Gaussian/metadata/benchmark_hasim.json
    data_root: /mnt/netdata/Team/AI/datasets/TMD/
    name: syn_objs

    sampling_strategy: all
    mf_scene_sampling_strategy: all

    meta_json: /mnt/netdata/Team/AI/datasets/TMD/Benchmark/Gaussian/metadata/metadata_hasim_mini.json
    meta_json_split: trainval

    pipeline: hAlgorithm/configs/dataset/pipeline_14x/base4d.py
    only_pointmap: true
    with_pointmap: true
    # min_depth: 0.001
    # max_depth: 64.0
    type: hAlgorithm.datasets_mv.base_dataset.BaseDatasetMV
    mf_to_mv: true
    clip_maxlen: null # 一次性推理所有帧
    clip_sampler:
      type: hAlgorithm.datasets_mv.clip_sampler.debug_trajectory.DebugTrajectory
      view_num: null # 一次性推理所有帧
      max_view: 10000000

    rbg_name: rgb
    depth_name: depth
    # normal_name: "normals"
    normal_name: none
    mask_name: none

