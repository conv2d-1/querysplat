# SynthVerse validation (Profile-B subset: 50 scenes x 64 frames, Q<=430).
#
# Trajectory npy live under SynthVerse/converted_subset50_64f_q430/;
# RGB/depth paths still point to SynthVerse/converted/.

datasets:
  - data_path: /mnt/nasTeam2/AI/datasets/TMD/SynthVerse/converted/train_mf_with_tracking_subset50_64f_q430.json
    data_root: /mnt/nasTeam2/AI/datasets/TMD/
    pipeline: hAlgorithm/configs/dataset/pipeline_14x/base4d.py
    name: synthverse_subset50
    type: hAlgorithm.datasets_4d.pointodyssey_track_dataset.PointOdysseyTrackDataset

    only_pointmap: true
    with_pointmap: true
    min_depth: 0.001
    max_depth: 70.0
    point_normalize_mode: "distance"

    sampling_strategy: [0]
    mf_scene_sampling_strategy: all
    prob: 1.0

    mf_to_mv: true
    clip_maxlen: null
    clip_step: null
    clip_sampler:
      type: hAlgorithm.datasets_mv.clip_sampler.sequential_sampler.SequentialClipSampler
      view_num: 64
      start_idx: 0
