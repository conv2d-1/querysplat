datasets:
  # 室外，场景，MVS
  # name megadepth
  # mf_data_scene 768
  # mf_to_mv True sf_to_mf False
  # mf_data_scene_mf 3629
  # mf_data_scene_frames max 100, min 6, mean 97, median 100   
  # mf_data_scene_views max 1, min 1, mean 1, median 1
  - data_path: /mnt/netdata/Team/AI/datasets/TMD/MegaDepth/megadepth_mf.json
    pair_path: /mnt/netdata/Team/AI/datasets/TMD/MegaDepth/pair_overlap_35.json
    only_pointmap: true
    with_pointmap: true
    min_depth: 0.001
    max_depth: 100.0
    point_normalize_mode: "distance"
    data_root: /mnt/netdata/Team/AI/datasets/TMD/
    pipeline: hAlgorithm/configs/dataset/pipeline_14x/base4d.py
    name: megadepth_35
    sampling_strategy: all
    mf_scene_sampling_strategy: all
    pair_sampling_strategy: all
    mvs_mode: true
    prob: 1.0
    type: hAlgorithm.datasets_match.pair_dataset.PairMatchingDataset
    match_scales: [1, 2, 4]
    mf_to_sf: false

  - data_path: /mnt/netdata/Team/AI/datasets/TMD/MegaDepth/megadepth_mf.json
    pair_path: /mnt/netdata/Team/AI/datasets/TMD/MegaDepth/pair_overlap_1.json
    only_pointmap: true
    with_pointmap: true
    min_depth: 0.001
    max_depth: 100.0
    point_normalize_mode: "distance"
    data_root: /mnt/netdata/Team/AI/datasets/TMD/
    pipeline: hAlgorithm/configs/dataset/pipeline_14x/base4d.py
    name: megadepth_1
    sampling_strategy: all
    mf_scene_sampling_strategy: all
    pair_sampling_strategy: all
    mvs_mode: true
    prob: 1.0
    type: hAlgorithm.datasets_match.pair_dataset.PairMatchingDataset
    match_scales: [1, 2, 4]
    mf_to_sf: false

  # 室内，场景，仿真
  # name hypersim
  # mf_data_scene 768
  # mf_to_mv True sf_to_mf False
  # mf_data_scene_mf 3629
  # mf_data_scene_frames max 100, min 6, mean 97, median 100   
  # mf_data_scene_views max 1, min 1, mean 1, median 1
  # inf mask: nan
  # original json /mnt/netdata/Team/AI/datasets/TMD/Hypersim_new/total_mf.json
  - data_path: /mnt/netdata/Team/AI/datasets/TMA_preprocess/preprocess_json/NormalSvd_v2_251016/hypersim_new_total_mf.json
    only_pointmap: true
    with_pointmap: true
    min_depth: 0.001
    max_depth: 100.0
    point_normalize_mode: "distance"
    data_root: /mnt/netdata/Team/AI/datasets/TMD/
    pipeline: hAlgorithm/configs/dataset/pipeline_14x/base4d.py
    name: hypersim
    sampling_strategy: all
    mf_scene_sampling_strategy: first:-10
    prob: 1.0

    with_inf_mask: false
    inf_mask_depth_nan: true

    type: hAlgorithm.datasets_mv.base_dataset.BaseDatasetMV
    mf_to_mv: true
    clip_maxlen: 12
    clip_step: null
    clip_sampler:
      type: hAlgorithm.datasets_mv.clip_sampler.random_sampler.RandomClipSampler
      view_num: 2
      seed: null
    
    mf_to_sf: false
