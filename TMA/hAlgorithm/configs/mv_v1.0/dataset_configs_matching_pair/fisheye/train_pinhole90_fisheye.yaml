datasets:
  # 室内，目标，仿真
  # name hablendeder_fisheye_objs_v2
  - data_path: [
      /mnt/netdata/Team/AI/datasets/TMA_preprocess/preprocess_json/NormalSvd_v2_260120/hasim_hablender_fisheye_v2_0203_h5.json,
      /mnt/netdata/Team/AI/datasets/TMD/HaSim/HaBlender/FishEye_v2/jsons/fisheye_v2_0227_exclusive_h5.json,
    ]
    only_pointmap: true
    with_pointmap: true
    min_depth: 0.001
    max_depth: 64.0
    point_normalize_mode: "distance"
    data_root: /mnt/netdata/Team/AI/datasets/TMD/
    pipeline: hAlgorithm/configs/dataset/pipeline_14x/base4d.py
    name: hablendeder_fisheye_objs_v2
    sampling_strategy: all
    mf_scene_sampling_strategy: "first:-5"
    fisheye_crop_pixel_normal: 5
    prob: 1.0

    type: hAlgorithm.datasets_fisheye.base_dataset_mv.BaseDatasetFisheyeMV
    mf_to_mv: true
    clip_maxlen: 12
    clip_step: null
    clip_sampler:
      type: hAlgorithm.datasets_mv.clip_sampler.random_sampler.RandomClipSampler
      view_num: 2
      seed: null
    
    hdf5: true
    rbg_name: rgb
    depth_name: depth
    normal_name: none
    normal_hdf5: none
    camera_type: "FISHEYE_EQUIDISTANT"
    # normal_name: none
    mask_name: none
    sem_name: none

    mf_to_sf: false


  # 室外，场景，MVS
  # name megadepth
  # mf_data_scene 768
  # mf_to_mv True sf_to_mf False
  # mf_data_scene_mf 3629
  # mf_data_scene_frames max 100, min 6, mean 97, median 100   
  # mf_data_scene_views max 1, min 1, mean 1, median 1
  - data_path: /mnt/netdata/Team/AI/datasets/TMD/MegaDepth/megadepth_mf.json
