    min_depth: 0.001
    max_depth: 64.0
    point_normalize_mode: "distance"
    data_root: /mnt/netdata/Team/AI/datasets/TMD/
    pipeline: hAlgorithm/configs/dataset/pipeline_14x/base4d.py
    name: hablendeder_objs
    sampling_strategy: [0]
    mf_scene_sampling_strategy: end:1 # NOTE: 第一个场景有问题

    type: hAlgorithm.datasets_mv.base_dataset.BaseDatasetMV
    mf_to_mv: true
    # clip_maxlen: null
    clip_step: 2
    clip_sampler:
      type: hAlgorithm.datasets_mv.clip_sampler.debug_trajectory.DebugTrajectory
      view_num: 1
    
    hdf5: true
    rbg_name: rgb
    depth_name: depth
    # normal_name: "normals"
    normal_name: none
    mask_name: none
  
  # 室外，场景，仿真
  # name mvssynth
  # mf_data_scene 120
  # mf_to_mv True sf_to_mf False
  # mf_data_scene_mf 1560
  # mf_data_scene_frames max 100, min 100, mean 100, median 100
  # mf_data_scene_views max 1, min 1, mean 1, median 1
  - data_path: /mnt/netdata/Team/AI/datasets/TMD/MVS-synth/train_mf.json
    only_pointmap: true
