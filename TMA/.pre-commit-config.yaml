repos:
  # - repo: https://github.com/PyCQA/isort
  - repo: ssh://git@code.hesaitech.com:10022/zheyuan/isort.git
    rev: 5.12.0
    hooks:
      - id: isort
        args: ['--profile=black']

  - repo: ssh://git@code.hesaitech.com:10022/zheyuan/black.git
    rev: 22.6.0
    hooks:
    -   id: black
  # - repo: https://github.com/PyCQA/flake8
  - repo: ssh://git@code.hesaitech.com:10022/zheyuan/flake8.git
    rev: 3.8.3
    hooks:
      - id: flake8
        args: ['--ignore=E501, W503, E203']
  - repo: ssh://git@code.hesaitech.com:10022/zheyuan/pre-commit-hooks.git
  # - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.3.0
    hooks:
      - id: check-added-large-files
      - id: trailing-whitespace
      - id: check-yaml
      - id: end-of-file-fixer
      - id: requirements-txt-fixer
      - id: check-merge-conflict
      - id: fix-encoding-pragma
        args: ["--remove"]
      - id: mixed-line-ending
        args: ["--fix=lf"]
  # - repo: https://github.com/codespell-project/codespell
  - repo: ssh://git@code.hesaitech.com:10022/zheyuan/codespell.git
    rev: v2.2.2
    hooks:
      - id: codespell
        args: ['--skip=*.po,*.ts,*.ipynb,*.cfg','--ignore-words-list=patten,hist,formating,datas,ans,codo,warpper']
  - repo: ssh://git@code.hesaitech.com:10022/zheyuan/mdformat.git
  # - repo: https://github.com/executablebooks/mdformat
    rev: 0.7.14
    hooks:
      - id: mdformat
        args: [ "--number" ]
        additional_dependencies:
          - mdformat-gfm
          - mdformat_frontmatter
          - linkify-it-py
  # - repo: https://github.com/PyCQA/docformatter
  - repo: ssh://git@code.hesaitech.com:10022/zheyuan/docformatter.git
    rev: v1.3.1
    hooks:
      - id: docformatter
        args: ["--in-place", "--wrap-descriptions", "88"]
